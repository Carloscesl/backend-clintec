<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido, colorPrimario, colorBadge, colorTextoBadge, icono)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="${titulo}">CRM Clintec</title>
    <style>
        /* ── Reset ──────────────────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── Body ───────────────────────────────────────── */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            padding: 24px;
            color: #334155;
        }

        /* ── Contenedor principal ────────────────────────── */
        .email-wrapper {
            max-width: 600px;
            margin: 0 auto;
        }
        .email-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* ── Header ──────────────────────────────────────── */
        .email-header {
            padding: 32px 28px;
            text-align: center;
        }
        .email-header .icono {
            font-size: 36px;
            margin-bottom: 12px;
            display: block;
        }
        .email-header h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
        }
        .email-header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            margin-top: 6px;
        }

        /* ── Body ────────────────────────────────────────── */
        .email-body {
            padding: 32px 28px;
        }
        .email-body .saludo {
            font-size: 15px;
            color: #475569;
            margin-bottom: 12px;
        }
        .email-body .descripcion {
            font-size: 14px;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        /* ── Badge ───────────────────────────────────────── */
        .badge-container {
            text-align: center;
            margin: 16px 0;
        }
        .badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ── Info card ───────────────────────────────────── */
        .info-card {
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            border: 1px solid #e2e8f0;
        }
        .info-card-header {
            padding: 10px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 16px;
            border-bottom: 1px solid #f1f5f9;
            background: #ffffff;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-row:nth-child(even) {
            background: #f8fafc;
        }
        .info-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
        }
        .info-value {
            font-size: 13px;
            color: #1e293b;
            font-weight: 500;
            text-align: right;
            max-width: 60%;
        }

        /* ── Tip box ─────────────────────────────────────── */
        .tip-box {
            border-radius: 0 8px 8px 0;
            padding: 14px 16px;
            margin: 20px 0;
            font-size: 13px;
            line-height: 1.6;
            border-left: 4px solid;
        }

        /* ── Botón CTA ───────────────────────────────────── */
        .btn-container {
            text-align: center;
            margin: 28px 0 8px;
        }
        .btn-cta {
            display: inline-block;
            padding: 14px 36px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.02em;
        }

        /* ── Divider ─────────────────────────────────────── */
        .divider {
            height: 1px;
            background: #f1f5f9;
            margin: 24px 0;
        }

        /* ── Footer ──────────────────────────────────────── */
        .email-footer {
            background: #f8fafc;
            padding: 20px 28px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        .email-footer p {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.9;
        }
        .email-footer a {
            color: #3b82f6;
            text-decoration: none;
        }

        /* ── Valor destacado ─────────────────────────────── */
        .valor-destacado {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin: 8px 0;
        }

        /* ── Alerta urgente ──────────────────────────────── */
        .alerta-urgente {
            border-radius: 8px;
            padding: 12px 16px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            margin: 16px 0;
        }
    </style>
</head>
<body>
<div class="email-wrapper">
    <div class="email-card">
        <!-- Header dinámico -->
        <div class="email-header" th:style="'background: linear-gradient(135deg,' + ${colorPrimario} + ')'">
            <span class="icono" th:text="${icono}">🔔</span>
            <h1 th:replace="${titulo}">Título</h1>
            <p>CRM Clintec — Notificación Automática</p>
        </div>

        <!-- Contenido dinámico de cada plantilla -->
        <div class="email-body" th:replace="${contenido}">
            Contenido aquí
        </div>

        <!-- Footer siempre igual -->
        <div class="email-footer">
            <p>CRM Clintec — Sistema de Gestión de Relaciones con Clientes</p>
            <p>Este es un mensaje automático. Por favor no respondas a este correo.</p>
            <p>Soporte: <a href="mailto:soporte@clinteccrm.com">soporte@clinteccrm.com</a></p>
        </div>
    </div>
</div>
</body>
</html>
